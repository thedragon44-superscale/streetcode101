<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropship Storefront</title>

  <!-- Custom CSS (Unchanged, just added a .hidden utility class) -->
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background-color: #f3f4f6; color: #1f2937; }
    .hidden { display: none !important; }
    
    .navbar { background-color: #1e3a8a; padding: 15px 24px; display: flex; justify-content: space-between; align-items: center; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); position: sticky; top: 0; z-index: 100; }
    .nav-search { flex-grow: 1; max-width: 600px; margin: 0 24px; display: flex; }
    .nav-search input { width: 100%; padding: 10px 16px; border: none; border-radius: 8px 0 0 8px; font-size: 1rem; outline: none; }
    .nav-search button { background-color: #f97316; border: none; border-radius: 0 8px 8px 0; padding: 0 20px; cursor: pointer; color: white; font-weight: bold; }

    .cart-toggle { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; }
    .cart-badge { background-color: #f97316; color: white; border-radius: 50%; padding: 4px 10px; font-size: 0.9rem; }

    .btn-fun { background-color: #f97316; color: white; border: none; border-radius: 9999px; padding: 12px 24px; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 0 #c2410c; transition: all 0.1s ease-in-out; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-fun:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 #c2410c; }
    .btn-fun:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 #c2410c; }
    .btn-fun:disabled { background-color: #9ca3af; box-shadow: 0 4px 0 #6b7280; cursor: not-allowed; }

    .cart-panel { position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100vh; background-color: white; box-shadow: -4px 0 15px rgba(0,0,0,0.1); transition: right 0.3s ease-in-out; z-index: 200; display: flex; flex-direction: column; }
    .cart-panel.open { right: 0; }
    .cart-header { background-color: #1e3a8a; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
    .cart-items { flex-grow: 1; overflow-y: auto; padding: 20px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #e5e7eb; padding-bottom: 15px; margin-bottom: 15px; }
    .cart-footer { padding: 20px; border-top: 2px solid #e5e7eb; background-color: #f9fafb; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: rgba(0,0,0,0.6); z-index: 300; display: flex; justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal-content input { width: 90%; padding: 10px; margin: 20px 0; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
    
    .site-footer { text-align: center; padding: 40px 20px; margin-top: 40px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 0.9rem; }
  </style>
</head>
<body>

  <!-- TOP NAVBAR -->
  <nav class="navbar">
    <img id="logo" src="./dragon_logo.png" alt="Pi-Drop Logo" style="height: 50px; cursor: pointer; user-select: none; transition: transform 0.1s;" />
    <div class="nav-search">
      <input type="text" placeholder="Search for electronics, gadgets, and more..." />
      <button>Search</button>
    </div>
    <button id="cart-toggle-btn" class="cart-toggle">
      🛒 Cart <span id="cart-badge" class="cart-badge hidden">0</span>
    </button>
  </nav>

  <!-- LOADING / ERROR STATE -->
  <div id="status-message" style="padding: 40px; text-align: center;">Loading storefront...</div>

  <!-- MAIN PRODUCT GRID -->
  <div style="max-width: 1200px; margin: 40px auto; padding: 0 24px;">
    <div id="product-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px;">
      <!-- Products injected here via JS -->
    </div>
  </div>

  <!-- SLIDE OUT CART PANEL -->
  <div id="cart-overlay" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: rgba(0,0,0,0.5); z-index: 150;"></div>
  
  <div id="cart-panel" class="cart-panel">
    <div class="cart-header">
      <h2 id="cart-header-text">Your Cart (0)</h2>
      <button id="close-cart-btn" style="background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;">×</button>
    </div>
    
    <div id="cart-items-container" class="cart-items">
      <p style="text-align: center; color: #6b7280; margin-top: 40px;">Your cart is empty.</p>
    </div>

    <div class="cart-footer">
      <div style="display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: bold; margin-bottom: 20px;">
        <span>Total:</span>
        <span id="cart-total-text">$0.00</span>
      </div>
      <button id="checkout-btn" class="btn-fun" style="width: 100%;" disabled>Proceed to Checkout</button>
    </div>
  </div>

  <!-- SITE FOOTER -->
  <footer class="site-footer">
    <p>© 2026 Pi-Drop Middleware. All rights reserved.</p>
  </footer>

<!-- CHECKOUT MODAL -->
  <div id="checkout-modal" class="modal-overlay hidden">
    <div class="modal-content" style="max-width: 400px; text-align: left;">
      <h3 style="margin: 0 0 15px 0; color: #1e3a8a; text-align: center;">Complete Your Order</h3>
      <form id="checkout-form">
        <label style="font-size: 0.85rem; font-weight: bold; color: #4b5563;">Email Address</label>
        <input type="email" id="chk-email" placeholder="you@example.com" required style="width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; box-sizing: border-box; display: block;" />

        <label style="font-size: 0.85rem; font-weight: bold; color: #4b5563;">Full Name</label>
        <input type="text" id="chk-name" placeholder="John Doe" required style="width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; box-sizing: border-box; display: block;" />
        
        <label style="font-size: 0.85rem; font-weight: bold; color: #4b5563;">Shipping Address</label>
        <input type="text" id="chk-street" placeholder="123 Main St" required style="width: 100%; padding: 10px; margin: 5px 0 10px 0; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; box-sizing: border-box; display: block;" />
        
        <div style="display: flex; gap: 10px; width: 100%;">
          <input type="text" id="chk-city" placeholder="City" required style="flex: 2; padding: 10px; margin: 0; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; box-sizing: border-box;" />
          <input type="text" id="chk-state" placeholder="TX" required style="flex: 1; padding: 10px; margin: 0; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; box-sizing: border-box;" />
          <input type="text" id="chk-zip" placeholder="Zip" required style="flex: 1; padding: 10px; margin: 0; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; box-sizing: border-box;" />
        </div>

        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 25px;">
          <button type="button" id="close-checkout-btn" style="padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; background: #e5e7eb; font-weight: bold; color: #4b5563;">Cancel</button>
          <button type="submit" id="confirm-order-btn" style="padding: 10px 20px; border: none; border-radius: 6px; background: #f97316; color: white; font-weight: bold; cursor: pointer; flex-grow: 1;">Pay Now</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ADMIN LOGIN MODAL -->
  <div id="login-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 style="margin: 0 0 10px 0; color: #1e3a8a;">Admin Access</h3>
      <p style="color: #6b7280; font-size: 0.9rem; margin: 0;">Enter your master password.</p>
      
      <form id="admin-login-form">
        <input type="password" id="admin-password" placeholder="••••••••" required />
        <div style="display: flex; gap: 10px; justify-content: center;">
          <button type="button" id="close-modal-btn" style="padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;">Cancel</button>
          <button type="submit" style="padding: 8px 16px; border: none; border-radius: 6px; background: #f97316; color: white; font-weight: bold; cursor: pointer;">Login</button>
        </div>
      </form>
    </div>
  </div>

  <!-- VANILLA JAVASCRIPT LOGIC -->
  <script>
    // --- STATE ---
    const API_BASE = 'http://127.0.0.1:8000/api';
    let products = [];
    let cart = [];
    let isCheckingOut = false;
    let logoClicks = 0;
    let logoClickTimer = null;

    // --- DOM ELEMENTS ---
    const productGrid = document.getElementById('product-grid');
    const statusMessage = document.getElementById('status-message');
    const cartPanel = document.getElementById('cart-panel');
    const cartOverlay = document.getElementById('cart-overlay');
    const cartBadge = document.getElementById('cart-badge');
    const cartItemsContainer = document.getElementById('cart-items-container');
    const cartHeaderText = document.getElementById('cart-header-text');
    const cartTotalText = document.getElementById('cart-total-text');
    const checkoutBtn = document.getElementById('checkout-btn');
    const loginModal = document.getElementById('login-modal');

    // --- INITIALIZE ---
    async function init() {
      try {
        const response = await fetch(`${API_BASE}/products`);
        if (!response.ok) throw new Error('Failed to fetch catalog.');
        products = await response.json();
        statusMessage.classList.add('hidden');
        renderProducts();
      } catch (err) {
        statusMessage.innerHTML = `<span style="color: red;">Error: ${err.message}</span>`;
      }
    }

    // --- RENDER FUNCTIONS ---
    function renderProducts() {
      productGrid.innerHTML = ''; // Clear grid
      products.forEach(product => {
        const card = document.createElement('div');
        card.style.cssText = 'background-color: white; border-radius: 12px; padding: 20px; border: 1px solid #e5e7eb;';
        
        card.innerHTML = `
          <img src="${product.image_url}" alt="${product.title}" style="width: 100%; height: 250px; object-fit: cover; border-radius: 8px;" />
          <h2 style="font-size: 1.25rem; color: #1e3a8a; margin-top: 16px;">${product.title}</h2>
          <p style="color: #4b5563; line-height: 1.5; min-height: 50px;">${product.description}</p>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <span style="font-size: 1.8rem; font-weight: 900; color: #111827;">$${product.price.toFixed(2)}</span>
            <button class="btn-fun add-to-cart-btn" data-sku="${product.sku}" ${!product.in_stock ? 'disabled' : ''}>
              ${product.in_stock ? 'Add to Cart' : 'Out of Stock'}
            </button>
          </div>
        `;
        productGrid.appendChild(card);
      });

      // Attach event listeners to newly created buttons
      document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const sku = e.target.getAttribute('data-sku');
          const product = products.find(p => p.sku === sku);
          addToCart(product);
        });
      });
    }

    function renderCart() {
      const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);
      const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      // Update badge and header
      if (cartCount > 0) {
        cartBadge.classList.remove('hidden');
        cartBadge.innerText = cartCount;
      } else {
        cartBadge.classList.add('hidden');
      }
      cartHeaderText.innerText = `Your Cart (${cartCount})`;
      cartTotalText.innerText = `$${cartTotal.toFixed(2)}`;
      
      // Update checkout button
      checkoutBtn.disabled = cart.length === 0 || isCheckingOut;

      // Update items list
      if (cart.length === 0) {
        cartItemsContainer.innerHTML = `<p style="text-align: center; color: #6b7280; margin-top: 40px;">Your cart is empty.</p>`;
        return;
      }

      cartItemsContainer.innerHTML = '';
      cart.forEach(item => {
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div>
            <h4 style="margin: 0 0 5px 0; color: #1e3a8a;">${item.title}</h4>
            <p style="margin: 0; color: #4b5563; font-size: 0.9rem;">Qty: ${item.quantity} × $${item.price.toFixed(2)}</p>
          </div>
          <button class="remove-btn" data-sku="${item.sku}" style="background: #fee2e2; color: #ef4444; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-weight: bold;">
            Remove
          </button>
        `;
        cartItemsContainer.appendChild(div);
      });

      // Attach event listeners to remove buttons
      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          removeFromCart(e.target.getAttribute('data-sku'));
        });
      });
    }

    // --- LOGIC FUNCTIONS ---
    function addToCart(product) {
      const existingItem = cart.find(item => item.sku === product.sku);
      if (existingItem) {
        existingItem.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      renderCart();
      toggleCart(true);
    }

    function removeFromCart(sku) {
      cart = cart.filter(item => item.sku !== sku);
      renderCart();
    }

    function toggleCart(show) {
      if (show) {
        cartPanel.classList.add('open');
        cartOverlay.classList.remove('hidden');
      } else {
        cartPanel.classList.remove('open');
        cartOverlay.classList.add('hidden');
      }
    }

    // Show the checkout form instead of instantly buying
    function handleCheckout() {
      if (cart.length === 0) return;
      toggleCart(false); // Close the side cart
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    // Close the checkout modal
    document.getElementById('close-checkout-btn').addEventListener('click', () => {
      document.getElementById('checkout-modal').classList.add('hidden');
    });

    // Handle the actual form submission
    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (cart.length === 0) return;
      
      const submitBtn = document.getElementById('confirm-order-btn');
      submitBtn.innerText = 'Processing...';
      submitBtn.disabled = true;

      // Format the data from the inputs
      const email = document.getElementById('chk-email').value;
      const name = document.getElementById('chk-name').value;
      const street = document.getElementById('chk-street').value;
      const city = document.getElementById('chk-city').value;
      const state = document.getElementById('chk-state').value;
      const zip = document.getElementById('chk-zip').value;
      
      const fullAddress = `${name}, ${street}, ${city}, ${state} ${zip}`;

      try {
        // Send the real data to the backend API
        const response = await fetch(`${API_BASE}/checkout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sku: cart[0].sku,
            quantity: cart[0].quantity,
            customer_email: email,
            shipping_address: fullAddress
          })
        });

        if (!response.ok) throw new Error("Checkout failed");
        
        const result = await response.json();
        alert(`🎉 Order Confirmed!\nOrder ID: #${result.order_id}\nYour item is now processing.`);
        
        // Clean up
        cart = []; 
        renderCart();
        document.getElementById('checkout-modal').classList.add('hidden');
        e.target.reset(); // Clear the form fields
      } catch (err) {
        alert("Error connecting to checkout API.");
      } finally {
        submitBtn.innerText = 'Pay Now';
        submitBtn.disabled = false;
      }
    });

    // --- EVENT LISTENERS ---
    document.getElementById('cart-toggle-btn').addEventListener('click', () => toggleCart(true));
    document.getElementById('close-cart-btn').addEventListener('click', () => toggleCart(false));
    cartOverlay.addEventListener('click', () => toggleCart(false));
    checkoutBtn.addEventListener('click', handleCheckout);

    // Secret Logo Click Logic
    document.getElementById('logo').addEventListener('click', () => {
      clearTimeout(logoClickTimer);
      logoClicks++;
      
      if (logoClicks >= 5) {
        loginModal.classList.remove('hidden');
        document.getElementById('admin-password').value = '';
        document.getElementById('admin-password').focus();
        logoClicks = 0;
      } else {
        logoClickTimer = setTimeout(() => logoClicks = 0, 3000);
      }
    });

    // Login Form Logic
    document.getElementById('close-modal-btn').addEventListener('click', () => loginModal.classList.add('hidden'));
    loginModal.addEventListener('click', (e) => {
      if (e.target === loginModal) loginModal.classList.add('hidden');
    });

    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('admin-password').value;
      const loginBtn = e.target.querySelector('button[type="submit"]');
      
      loginBtn.innerText = 'Logging in...';
      loginBtn.disabled = true;

      try {
        const response = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        if (!response.ok) throw new Error('Incorrect password');
        
        // Save the JWT token to the browser, then redirect
        const data = await response.json();
        localStorage.setItem('admin_token', data.access_token);
        window.location.href = '/admin.html';
      } catch (err) {
        alert(err.message);
        document.getElementById('admin-password').value = '';
      } finally {
        loginBtn.innerText = 'Login';
        loginBtn.disabled = false;
      }
    });

    // Kickoff
    init();
  </script>
</body>
</html>
